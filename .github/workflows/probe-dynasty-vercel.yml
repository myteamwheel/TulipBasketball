name: probe-dynasty-vercel
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/probe-dynasty-vercel.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe deployment and production alias
        run: |
          set +e
          for u in \
            'https://dynasty-boys-dashboard-et6a7w0q3-myteamwheel-8058s-projects.vercel.app/' \
            'https://dynasty-boys-dashboard-myteamwheel-8058s-projects.vercel.app/' \
            'https://dynasty-boys-dashboard.vercel.app/'; do
            echo "===== $u ====="
            curl -L --max-time 30 -sS -D /tmp/h -o /tmp/b "$u"
            code=$?
            echo "curl_exit=$code"
            head -20 /tmp/h || true
            echo '--- feature markers ---'
            grep -Eio 'Biggest KTC changes|Tradyr|Dynasty Dealer|Stats Guy|Decision Board|Orlando Oswalds|Persistent performance history|server error|This page couldn.t load' /tmp/b | head -80 || true
            echo '--- error clues ---'
            grep -Eio '.{0,120}(digest|error|database|relation|column|prisma|connect|undefined|exception|DATABASE_URL).{0,240}' /tmp/b | head -30 || true
            echo "body_bytes=$(wc -c < /tmp/b 2>/dev/null || echo 0)"
          done

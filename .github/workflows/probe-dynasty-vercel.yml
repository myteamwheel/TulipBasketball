name: probe-dynasty-vercel
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/probe-dynasty-vercel.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe public production diagnostics
        run: |
          set +e
          for path in '/api/debug-home' '/api/recovery-backup-audit' '/settings' '/'; do
            u="https://dynasty-boys-dashboard.vercel.app${path}"
            echo "===== $u ====="
            curl --max-time 30 -sS -D /tmp/h -o /tmp/b "$u"
            echo "curl_exit=$? status=$(awk 'NR==1{print $2}' /tmp/h)"
            head -12 /tmp/h || true
            echo '--- BODY ---'
            head -c 12000 /tmp/b || true
            echo
          done

name: Dynasty Patch 11 CI

on:
  push:
    branches: [dynasty-patch11-deploy]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct Patch 11 source
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path'),zlib=require('zlib');
          const parts=Array.from({length:10},(_,i)=>`payload.${i}.txt`);
          let packed='';
          for (const part of parts) packed += fs.readFileSync(path.join('dynasty-patch11',part),'utf8').trim();
          if (packed.length !== 84264) throw new Error(`payload length ${packed.length} != 84264`);
          const payload=JSON.parse(zlib.brotliDecompressSync(Buffer.from(packed,'base64')).toString('utf8'));
          if (Object.keys(payload).length !== 58) throw new Error(`source file count ${Object.keys(payload).length} != 58`);
          fs.mkdirSync('/tmp/dynasty-patch11',{recursive:true});
          for(const [rel,item] of Object.entries(payload)){
            const dest=path.join('/tmp/dynasty-patch11',rel);
            fs.mkdirSync(path.dirname(dest),{recursive:true});
            fs.writeFileSync(dest,item.encoding==='base64'?Buffer.from(item.data,'base64'):item.data);
          }
          console.log(`Reconstructed ${Object.keys(payload).length} files`);
          NODE
      - name: Verify Patch 11 marker
        working-directory: /tmp/dynasty-patch11
        run: grep -R -q 'DECISION CENTER + QOL PATCH 11' src
      - name: Install dependencies
        working-directory: /tmp/dynasty-patch11
        run: npm install
      - name: Generate Prisma client
        working-directory: /tmp/dynasty-patch11
        run: npx prisma generate
      - name: TypeScript validation
        working-directory: /tmp/dynasty-patch11
        run: npx tsc --noEmit
      - name: Next.js build validation
        working-directory: /tmp/dynasty-patch11
        env:
          DATABASE_URL: postgresql://user:pass@127.0.0.1:5432/placeholder
        run: npx next build

name: validate-patch13-qol
on:
  push:
    branches: [dynasty-patch13-qol-20260816]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconstruct Patch 12 plus QOL overlay
        shell: bash
        run: |
          mkdir -p recovered-app
          node <<'NODE'
          const fs=require('fs'),path=require('path'),zlib=require('zlib');
          function apply(payload){for(const [rel,item] of Object.entries(payload)){const d=path.join('recovered-app',rel);if(item.op==='delete'){fs.rmSync(d,{force:true,recursive:true});continue;}fs.mkdirSync(path.dirname(d),{recursive:true});fs.writeFileSync(d,item.encoding==='base64'?Buffer.from(item.data,'base64'):item.data);}}
          const baseParts=['payload.0.txt','payload.1.txt','payload.2a.txt','payload.2b.txt','payload.3.txt','payload.4.txt','payload.5.txt','payload.6.txt','payload.7.txt'];
          const base=JSON.parse(zlib.brotliDecompressSync(Buffer.from(baseParts.map(f=>fs.readFileSync(path.join('dynasty-patch10',f),'utf8').trim()).join(''),'base64')).toString('utf8')); apply(base);
          const p12parts=['part.00','part.01','part.02','part.03','part.04'];
          const p12=JSON.parse(zlib.brotliDecompressSync(Buffer.from(p12parts.map(f=>fs.readFileSync(path.join('deploy/exact12-overlay',f),'utf8').trim()).join(''),'base64')).toString('utf8')); apply(p12);
          const qolPacked=['part.00','part.01'].map(f=>fs.readFileSync(path.join('deploy/qol-patch13',f),'utf8').trim()).join('');
          const qol=JSON.parse(zlib.brotliDecompressSync(Buffer.from(qolPacked,'base64')).toString('utf8')); apply(qol);
          const mp=path.join('recovered-app','src/lib/marketSources.ts'); let src=fs.readFileSync(mp,'utf8');
          const before='if (statuses.find((s)=>s.source==="KTC")?.ok && statuses.find((s)=>s.source==="STATSGUY")?.ok) {';
          const after='if (ktcResult.status === "fulfilled" && sgResult.status === "fulfilled" && statuses.find((s)=>s.source==="KTC")?.ok && statuses.find((s)=>s.source==="STATSGUY")?.ok) {';
          if(!src.includes(before)) throw new Error('Patch 12 calibration guard not found'); fs.writeFileSync(mp,src.replace(before,after));
          console.log('Patch 13 QOL reconstructed');
          NODE
      - name: Typecheck and build
        working-directory: recovered-app
        run: |
          npm install --ignore-scripts
          npx prisma generate
          npx tsc --noEmit
          npm run build
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/postgres
          BACKUP_DATABASE_URL: postgresql://user:pass@localhost:5432/postgres

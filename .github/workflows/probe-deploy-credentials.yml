name: probe-deploy-credentials

on:
  push:
    paths: ['.github/workflows/probe-deploy-credentials.yml']
  workflow_dispatch:

# Re-run credential-presence probe for Patch 14 deployment debugging.
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Report credential presence only
        env:
          HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
          HAS_VERCEL_ORG_ID_SECRET: ${{ secrets.VERCEL_ORG_ID != '' }}
          HAS_VERCEL_PROJECT_ID_SECRET: ${{ secrets.VERCEL_PROJECT_ID != '' }}
          HAS_VERCEL_ORG_ID_VAR: ${{ vars.VERCEL_ORG_ID != '' }}
          HAS_VERCEL_PROJECT_ID_VAR: ${{ vars.VERCEL_PROJECT_ID != '' }}
          HAS_NEON_API_KEY: ${{ secrets.NEON_API_KEY != '' }}
          HAS_DATABASE_URL: ${{ secrets.DATABASE_URL != '' }}
          HAS_RECOVERY_DATABASE_URL: ${{ secrets.RECOVERY_DATABASE_URL != '' }}
          HAS_NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL != '' }}
        run: |
          echo "VERCEL_TOKEN=${HAS_VERCEL_TOKEN}"
          echo "VERCEL_ORG_ID_SECRET=${HAS_VERCEL_ORG_ID_SECRET}"
          echo "VERCEL_PROJECT_ID_SECRET=${HAS_VERCEL_PROJECT_ID_SECRET}"
          echo "VERCEL_ORG_ID_VAR=${HAS_VERCEL_ORG_ID_VAR}"
          echo "VERCEL_PROJECT_ID_VAR=${HAS_VERCEL_PROJECT_ID_VAR}"
          echo "NEON_API_KEY=${HAS_NEON_API_KEY}"
          echo "DATABASE_URL=${HAS_DATABASE_URL}"
          echo "RECOVERY_DATABASE_URL=${HAS_RECOVERY_DATABASE_URL}"
          echo "NEON_DATABASE_URL=${HAS_NEON_DATABASE_URL}"

name: hotfix-playerstats
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply narrow type hotfix
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='recovered-app/src/lib/playerStats.ts';
          let s=fs.readFileSync(p,'utf8');
          s=s.replace('"sourceUpdatedAt" | "observedAt">', '"sourceUpdatedAt" | "observedAt" | "source">');
          s=s.replace('(input as AnyObj).refreshRunId', '(input as unknown as AnyObj).refreshRunId');
          fs.writeFileSync(p,s);
          NODE
          if git diff --quiet; then echo 'Already fixed'; exit 0; fi
          git config user.name 'ChatGPT Dashboard Patch'
          git config user.email 'actions@users.noreply.github.com'
          git add recovered-app/src/lib/playerStats.ts
          git commit -m 'Fix player stats input typing'
          git push origin HEAD:main

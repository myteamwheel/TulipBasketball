name: probe-hosting-secrets
on:
  push:
    paths: ['.github/workflows/probe-hosting-secrets.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Report secret availability only
        env:
          HAS_RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN != '' }}
          HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
          HAS_VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID != '' }}
          HAS_VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID != '' }}
          HAS_DATABASE_URL: ${{ secrets.DATABASE_URL != '' }}
          HAS_BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL != '' }}
          HAS_RECOVERY_BACKUP_DATABASE_URL: ${{ secrets.RECOVERY_BACKUP_DATABASE_URL != '' }}
        run: |
          printf 'RAILWAY_TOKEN=%s\n' "$HAS_RAILWAY_TOKEN"
          printf 'VERCEL_TOKEN=%s\n' "$HAS_VERCEL_TOKEN"
          printf 'VERCEL_ORG_ID=%s\n' "$HAS_VERCEL_ORG_ID"
          printf 'VERCEL_PROJECT_ID=%s\n' "$HAS_VERCEL_PROJECT_ID"
          printf 'DATABASE_URL=%s\n' "$HAS_DATABASE_URL"
          printf 'BACKUP_DATABASE_URL=%s\n' "$HAS_BACKUP_DATABASE_URL"
          printf 'RECOVERY_BACKUP_DATABASE_URL=%s\n' "$HAS_RECOVERY_BACKUP_DATABASE_URL"

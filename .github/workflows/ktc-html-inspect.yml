name: ktc-html-inspect
on:
  push:
    branches: [dynasty-db-diagnostic-probe-20260816]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect page HTML
        run: |
          node <<'NODE'
          for (const page of [9,10,11,12]) {
            const url=`https://keeptradecut.com/dynasty-rankings?page=${page}`;
            const r=await fetch(url,{headers:{'user-agent':'Mozilla/5.0','cache-control':'no-cache'}}); const h=await r.text();
            const i=h.toLowerCase().indexOf('joe mixon');
            console.log('PAGE',page,'STATUS',r.status,'LEN',h.length,'INDEX',i);
            if(i>=0) console.log(h.slice(Math.max(0,i-1200),i+2200).replace(/\s+/g,' '));
          }
          NODE

name: p13-live-probe
on:
  push:
    branches: [dynasty-p13-live-probe-20260816]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe all aliases now
        run: |
          for base in \
          'https://dynasty-boys-dashboard-r8tzxkzqh-myteamwheel-8058s-projects.vercel.app' \
          'https://dynasty-boys-dashboard-myteamwheel-8058s-projects.vercel.app' \
          'https://dynasty-boys-dashboard.vercel.app'; do
            echo "===== $base ====="
            for path in / /settings /api/recovery-backup-audit; do
              code=$(curl -L --max-time 30 -sS -o /tmp/b -w '%{http_code}' "$base$path" || true)
              echo "$path HTTP=$code"
              grep -o 'Build: PATCH 13[^<]*' /tmp/b | head || true
              grep -o 'Decision Desk' /tmp/b | head || true
              head -c 200 /tmp/b | tr '\n' ' '; echo
            done
          done

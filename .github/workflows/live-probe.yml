name: p13-live-probe
on:
  push:
    branches: [dynasty-p13-live-probe-20260816]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh and verify three-source production
        shell: bash
        run: |
          set +e
          BASE='https://dynasty-boys-dashboard.vercel.app'
          echo '===== START REFRESH ====='
          curl -L --max-time 45 -sS -X POST -H 'content-type: application/json' "$BASE/api/refresh"; echo
          for i in {1..12}; do
            sleep 5
            body=$(curl -L --max-time 45 -sS "$BASE/api/refresh")
            echo "attempt=$i ${body:0:600}"
            echo "$body" > /tmp/status
            if echo "$body" | grep -q '"status":"SUCCESS"'; then break; fi
          done
          echo '===== FINAL REFRESH STATUS ====='
          cat /tmp/status; echo
          echo '===== SETTINGS SOURCE HEALTH ====='
          curl -L --max-time 45 -sS "$BASE/settings" -o /tmp/settings
          grep -o 'Build: PATCH 13[^<]*' /tmp/settings | head || true
          grep -o 'Dynasty Dealer' /tmp/settings | head -10 || true
          grep -o 'fresh' /tmp/settings | head -10 || true
          echo '===== ROOT ====='
          curl -L --max-time 45 -sS -o /tmp/root -w 'HTTP=%{http_code}\n' "$BASE/"
          grep -o 'Decision Desk' /tmp/root | head || true

name: p13-live-probe
on:
  push:
    branches: [dynasty-p13-live-probe-20260816]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect canonical production errors
        run: |
          BASE='https://dynasty-boys-dashboard.vercel.app'
          for path in / /settings /api/refresh /api/recovery-old-db-audit /api/recovery-backup-audit; do
            echo "===== $path ====="
            curl -L --max-time 45 -sS -D /tmp/h -o /tmp/b -w 'HTTP=%{http_code}\n' "$BASE$path" || true
            grep -Ei '^(x-vercel-id|x-vercel-cache|x-matched-path|server|content-type):' /tmp/h || true
            echo 'BODY:'
            head -c 5000 /tmp/b || true
            echo; echo
          done

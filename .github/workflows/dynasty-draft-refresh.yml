name: Refresh dynasty draft grades
on:
  schedule:
    - cron: '30 12 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dynasty-draft-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Refresh completed rookie drafts and fantasy production
        run: python3 scripts/collect-draft-grades.py
      - name: Publish updated archive
        run: |
          git config user.name "Dynasty Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/draft-selections.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh dynasty draft grades"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

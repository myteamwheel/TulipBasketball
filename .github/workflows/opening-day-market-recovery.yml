name: Opening-day market recovery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/opening-day-market-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call guarded production recovery route
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          args=(-A "vercel-cron/1.0")
          if [[ -n "${CRON_SECRET:-}" ]]; then
            args+=(-H "Authorization: Bearer ${CRON_SECRET}")
          fi
          curl --fail-with-body --silent --show-error --retry 2 --retry-delay 5 "${args[@]}" \
            https://dynasty-boys-dashboard.vercel.app/api/cron/opening-day-recovery

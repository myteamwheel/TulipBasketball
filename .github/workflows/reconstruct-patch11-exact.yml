name: reconstruct-patch11-exact
on:
  push:
    branches: [dynasty-patch11-exact-reconstruct-20260816b]
jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct Patch 11
        shell: bash
        run: |
          mkdir -p recovered-app
          node <<'NODE'
          const fs=require('fs'), path=require('path'), zlib=require('zlib');
          const dir='dynasty-patch11';
          const chunks=fs.readdirSync(dir).filter(f=>/^payload\.\d+\.txt$/.test(f)).sort((a,b)=>Number(a.split('.')[1])-Number(b.split('.')[1]));
          const packed=chunks.map(f=>fs.readFileSync(path.join(dir,f),'utf8').trim()).join('');
          let raw;
          const buf=Buffer.from(packed,'base64');
          for (const fn of [zlib.brotliDecompressSync,zlib.gunzipSync,zlib.inflateSync]) { try { raw=fn(buf); break; } catch {} }
          if(!raw) throw new Error('Could not decompress Patch 11 payload');
          const payload=JSON.parse(raw.toString('utf8'));
          for(const [rel,item] of Object.entries(payload)){
            const dest=path.join('recovered-app',rel);
            fs.mkdirSync(path.dirname(dest),{recursive:true});
            fs.writeFileSync(dest,item.encoding==='base64'?Buffer.from(item.data,'base64'):item.data);
          }
          console.log(`Recovered ${Object.keys(payload).length} files from ${chunks.length} chunks`);
          NODE
          find recovered-app -maxdepth 3 -type f | sort | head -150
      - name: Upload exact Patch 11 source
        uses: actions/upload-artifact@v4
        with:
          name: dynasty-patch11-exact-source
          path: recovered-app
          include-hidden-files: true

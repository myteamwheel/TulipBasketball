name: probe-env-injection-vercel
on:
  push:
    paths: ['.github/workflows/probe-env-injection-vercel.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployment env injection
        run: |
          set -euo pipefail
          u='https://dynasty-env-injection-probe-av5mo64us.vercel.app/api/check'
          for i in $(seq 1 20); do
            code=$(curl -sS -o /tmp/body -w '%{http_code}' "$u" || true)
            echo "attempt=$i status=$code body=$(cat /tmp/body 2>/dev/null || true)"
            if [ "$code" = 200 ]; then grep -q '"present":true' /tmp/body && exit 0; fi
            sleep 5
          done
          exit 1

name: reconstruct-dynasty-dashboard
on:
  push:
    branches: [dynasty-db-recovery2-20260816]
jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct verified Patch 10 source
        shell: bash
        run: |
          mkdir -p recovered-app
          node <<'NODE'
          const fs=require('fs'), path=require('path'), zlib=require('zlib');
          const dir='dynasty-patch10';
          const parts=['payload.0.txt','payload.1.txt','payload.2a.txt','payload.2b.txt','payload.3.txt','payload.4.txt','payload.5.txt','payload.6.txt','payload.7.txt'];
          const packed=parts.map(f=>fs.readFileSync(path.join(dir,f),'utf8').trim()).join('');
          if(packed.length!==75328) throw new Error(`payload length ${packed.length}`);
          const payload=JSON.parse(zlib.brotliDecompressSync(Buffer.from(packed,'base64')).toString('utf8'));
          for(const [rel,item] of Object.entries(payload)){
            const dest=path.join('recovered-app',rel);
            fs.mkdirSync(path.dirname(dest),{recursive:true});
            fs.writeFileSync(dest,item.encoding==='base64'?Buffer.from(item.data,'base64'):item.data);
          }
          console.log(`Recovered ${Object.keys(payload).length} files`);
          NODE
          find recovered-app -maxdepth 2 -type f | sort | head -100
      - name: Upload reconstructed source
        uses: actions/upload-artifact@v4
        with:
          name: dynasty-patch10-recovered-source
          path: recovered-app
          include-hidden-files: true

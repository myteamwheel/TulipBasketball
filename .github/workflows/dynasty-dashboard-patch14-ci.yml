name: dynasty-dashboard-patch14-ci
on:
  push:
    branches: [main]
    paths:
      - 'recovered-app/**'
      - 'package.json'
      - '.github/workflows/dynasty-dashboard-patch14-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: recovered-app/package-lock.json
      - name: Install
        working-directory: recovered-app
        run: npm ci
      - name: Prisma generate
        working-directory: recovered-app
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/postgres
        run: npx prisma generate
      - name: Typecheck
        working-directory: recovered-app
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/postgres
        run: npx tsc --noEmit
      - name: Build
        working-directory: recovered-app
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/postgres
          BACKUP_DATABASE_URL: postgresql://user:pass@localhost:5432/postgres
          STATSGUY_REFRESH_ENABLED: 'false'
          TRADYR_REFRESH_ENABLED: 'true'
          DYNASTYDEALER_REFRESH_ENABLED: 'true'
        run: npm run build

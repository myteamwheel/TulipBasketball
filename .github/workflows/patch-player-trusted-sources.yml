name: patch-player-trusted-sources
on:
  push:
    branches: [main]
    paths: ['.github/workflows/patch-player-trusted-sources.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace diagnostic Stats Guy UI with trusted sources
        shell: python
        run: |
          from pathlib import Path
          p=Path('recovered-app/src/app/(app)/players/[id]/page.tsx')
          s=p.read_text()
          if 'getTrustedMarketContext' not in s:
              s=s.replace('import { signalActionCopy } from "@/lib/dashboardInsights";\n', 'import { signalActionCopy } from "@/lib/dashboardInsights";\nimport { getTrustedMarketContext } from "@/lib/trustedMarketContext";\n')
          if 'const trustedMarket =' not in s:
              s=s.replace('  const signalEntry = signals.get(id);\n', '  const signalEntry = signals.get(id);\n  const trustedMarket = (await getTrustedMarketContext([id])).get(id);\n')
          s=s.replace('''  const sourceCandidates = [\n    { label:"SG→KTC", value:signalEntry?.statsGuyValue ?? null },\n    { label:"DD→KTC", value:signalEntry?.dynastyDealerValue ?? null },\n  ].filter((x): x is {label:string;value:number} => freshKtc !== null && freshKtc > 0 && x.value !== null);''','''  const sourceCandidates = [\n    { label:"Tradyr→KTC", value:trustedMarket?.tradyr.value ?? null },\n    { label:"Dynasty Dealer→KTC", value:trustedMarket?.dynastyDealer.value ?? null },\n  ].filter((x): x is {label:string;value:number} => freshKtc !== null && freshKtc > 0 && x.value !== null);''')
          s=s.replace('(signalEntry?.statsGuyValue !== null || signalEntry?.dynastyDealerValue !== null)', '(trustedMarket?.tradyr.value !== null || trustedMarket?.dynastyDealer.value !== null)')
          s=s.replace('Stats Guy → KTC scale', 'Tradyr → KTC scale')
          s=s.replace('formatPoints(signalEntry?.statsGuyValue ?? null)', 'formatPoints(trustedMarket?.tradyr.value ?? null)')
          s=s.replace('KTC-equivalent after same-refresh scale calibration{signalEntry?.statsGuyRawValue !== null && signalEntry?.statsGuyRawValue !== undefined ? ` · raw secondary ${signalEntry.statsGuyRawValue.toLocaleString()}` : ""}', 'Trusted secondary market after same-refresh KTC calibration{trustedMarket?.tradyr.rawValue !== null && trustedMarket?.tradyr.rawValue !== undefined ? ` · raw Tradyr ${trustedMarket.tradyr.rawValue.toLocaleString()}` : ""}')
          s=s.replace('formatPoints(signalEntry?.dynastyDealerValue ?? null)', 'formatPoints(trustedMarket?.dynastyDealer.value ?? null)')
          s=s.replace('Real-trade-market cross-check after same-refresh KTC calibration{signalEntry?.dynastyDealerRawValue !== null && signalEntry?.dynastyDealerRawValue !== undefined ? ` · raw DD ${signalEntry.dynastyDealerRawValue.toLocaleString()}` : ""}', 'Real-trade-market cross-check after same-refresh KTC calibration{trustedMarket?.dynastyDealer.rawValue !== null && trustedMarket?.dynastyDealer.rawValue !== undefined ? ` · raw DD ${trustedMarket.dynastyDealer.rawValue.toLocaleString()}` : ""}')
          s=s.replace('fresh Stats Guy → KTC scale market data, and nflverse production data', 'fresh Tradyr / Dynasty Dealer cross-checks, persistent game grades, and nflverse/Sleeper production data')
          p.write_text(s)
      - name: Commit patch
        run: |
          git config user.name 'ChatGPT Dashboard Patch'
          git config user.email 'actions@users.noreply.github.com'
          git add 'recovered-app/src/app/(app)/players/[id]/page.tsx'
          if git diff --cached --quiet; then echo 'Already patched'; else git commit -m 'Show Tradyr and Dynasty Dealer on player pages'; git push; fi

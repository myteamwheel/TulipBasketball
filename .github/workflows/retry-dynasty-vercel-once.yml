name: retry-dynasty-vercel-once

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retry-once:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for the Vercel build-rate window to clear, then self-delete and trigger one push
        shell: bash
        run: |
          now=$(date -u +%s)
          not_before=$(date -u -d '2026-08-17T00:30:00Z' +%s)
          if (( now < not_before )); then
            echo "Not before 2026-08-17T00:30:00Z; exiting without a push."
            exit 0
          fi
          rm .github/workflows/retry-dynasty-vercel-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/retry-dynasty-vercel-once.yml
          git commit -m "chore: retry Dynasty Vercel deployment after quota reset"
          git push origin HEAD:main

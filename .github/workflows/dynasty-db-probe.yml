name: dynasty-db-probe
on:
  push:
    branches: [dynasty-db-diagnostic-probe-20260816]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect current production recovery paths
        shell: bash
        run: |
          set +e
          BASE='https://dynasty-boys-dashboard.vercel.app'
          echo '===== ROOT ====='
          curl -L --max-time 30 -sS -o /tmp/root -w 'status=%{http_code}\n' "$BASE/"
          grep -o 'Decision Desk' /tmp/root | head || true
          echo '===== SETTINGS MARKERS ====='
          curl -L --max-time 30 -sS -o /tmp/settings -w 'status=%{http_code}\n' "$BASE/settings"
          grep -o 'DECISION CENTER + QOL PATCH 11' /tmp/settings | head || true
          grep -o 'SOURCE TRUST + WAIVER CALIBRATION PATCH 12' /tmp/settings | head || true
          echo '===== OLD DB AUDIT ====='
          curl -L --max-time 45 -sS -o /tmp/old -w 'status=%{http_code}\n' "$BASE/api/recovery-old-db-audit"
          cat /tmp/old; echo
          echo '===== BACKUP AUDIT ====='
          curl -L --max-time 45 -sS -o /tmp/backup -w 'status=%{http_code}\n' "$BASE/api/recovery-backup-audit"
          cat /tmp/backup; echo
          echo '===== REFRESH STATUS ====='
          curl -L --max-time 45 -sS "$BASE/api/refresh" || true
          echo

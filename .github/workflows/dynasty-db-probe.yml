name: dynasty-db-probe
on:
  push:
    branches: [dynasty-db-diagnostic-probe-20260816]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Capture production runtime error
        shell: bash
        run: |
          set +e
          BASE='https://dynasty-boys-dashboard.vercel.app'
          for path in / /settings /api/refresh; do
            echo "===== $path ====="
            curl -L --max-time 30 -sS -D /tmp/h "$BASE$path" -o /tmp/body
            cat /tmp/h
            echo '--- BODY ---'
            head -c 16000 /tmp/body
            echo
          done

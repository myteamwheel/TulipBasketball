name: dynasty-db-probe
on:
  push:
    branches: [dynasty-db-diagnostic-probe-20260816]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe live Patch 12 and trigger first refresh
        shell: bash
        run: |
          set +e
          BASE='https://dynasty-boys-dashboard.vercel.app'
          echo '===== ROOT ====='
          curl -L --max-time 30 -sS -D /tmp/h "$BASE/" -o /tmp/root
          cat /tmp/h
          grep -o 'SOURCE TRUST + WAIVER CALIBRATION PATCH 12' /tmp/root || true
          grep -o 'Dynasty Boys' /tmp/root | head || true
          echo '===== SETTINGS ====='
          curl -L --max-time 30 -sS "$BASE/settings" -o /tmp/settings
          grep -o 'SOURCE TRUST + WAIVER CALIBRATION PATCH 12' /tmp/settings || true
          echo '===== REFRESH STATUS BEFORE ====='
          curl -L --max-time 30 -sS "$BASE/api/refresh" || true
          echo
          echo '===== START REFRESH ====='
          curl -L --max-time 30 -sS -X POST -H 'content-type: application/json' "$BASE/api/refresh" || true
          echo
          sleep 12
          echo '===== REFRESH STATUS AFTER ====='
          curl -L --max-time 30 -sS "$BASE/api/refresh" || true
          echo
          # recovery probe 2

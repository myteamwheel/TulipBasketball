name: dynasty-db-probe
on:
  push:
    branches: [dynasty-db-diagnostic-probe-20260816]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Immediate production verification
        shell: bash
        run: |
          set +e
          BASE='https://dynasty-boys-dashboard.vercel.app'
          echo '===== ROOT ====='
          curl -L --max-time 30 -sS -D /tmp/h "$BASE/" -o /tmp/root
          cat /tmp/h
          echo 'markers:'
          grep -o 'SOURCE TRUST + WAIVER CALIBRATION PATCH 12' /tmp/root | head || true
          grep -o '≥2 fresh sources required' /tmp/root | head || true
          grep -o 'KTC anchor; secondary source optional' /tmp/root | head || true
          echo '===== SETTINGS ====='
          curl -L --max-time 30 -sS "$BASE/settings" -o /tmp/settings
          grep -o 'SOURCE TRUST + WAIVER CALIBRATION PATCH 12' /tmp/settings | head || true
          grep -o 'Independent automatic backup' /tmp/settings | head || true
          grep -o '8:00 AM Eastern' /tmp/settings | head || true
          echo '===== REFRESH STATUS ====='
          curl -L --max-time 30 -sS "$BASE/api/refresh" || true
          echo

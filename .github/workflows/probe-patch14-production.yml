name: probe-patch14-production
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-patch14-production.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Wait briefly for production alias propagation
        run: sleep 15
      - name: Probe exact successful deployment and permanent production domain
        run: |
          set -euo pipefail
          DEPLOYMENT='https://dynasty-boys-dashboard-q4xjgskco-myteamwheel-8058s-projects.vercel.app'
          PROD='https://dynasty-boys-dashboard.vercel.app'
          stamp=$(date +%s)

          probe() {
            name="$1"
            url="$2"
            echo "===== ${name}: ${url} ====="
            code=$(curl -L --max-time 30 -sS -H 'Cache-Control: no-cache, no-store, max-age=0' -H 'Pragma: no-cache' -o "/tmp/${name}.html" -w '%{http_code}' "${url}?probe=${stamp}")
            echo "HTTP=${code}"
            echo "MARKERS:"
            grep -Eo 'Data Health[^<]{0,40}|Patch 14|Tradyr|Dynasty Dealer|FantasyCalc|Stats Guy|Decision Center|Power Board|Orlando Oswalds' "/tmp/${name}.html" | sort -u || true
            echo "BODY_HEAD:"
            head -c 1200 "/tmp/${name}.html" || true
            echo
          }

          probe deployment "$DEPLOYMENT/"
          probe production "$PROD/"
          probe settings "$PROD/settings"

          grep -q 'Patch 14' /tmp/settings.html
          grep -q 'Tradyr' /tmp/settings.html
          grep -q 'Dynasty Dealer' /tmp/settings.html
          echo 'PATCH14_PRODUCTION_MARKERS_OK'

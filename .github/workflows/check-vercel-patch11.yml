name: Check Vercel Patch 11

on:
  push:
    branches: [dynasty-patch11-deploy]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public Patch 11
        shell: bash
        run: |
          set -euo pipefail
          base='https://dynasty-boys-dashboard.vercel.app'
          check() {
            path="$1"
            marker="$2"
            echo "===== ${path} ====="
            curl -fsSL --max-time 30 "${base}${path}" -o /tmp/page
            if grep -Fq "$marker" /tmp/page; then
              echo "FOUND: $marker"
            else
              echo "MISSING: $marker"
              exit 1
            fi
          }
          check '/settings' 'DECISION CENTER + QOL PATCH 11'
          check '/' 'decision dashboard'
          check '/league' 'Power board'
          check '/players' 'Search + opportunity radar'
          check '/refresh-history' 'Data Health'

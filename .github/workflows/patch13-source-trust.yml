name: patch13-source-trust
on:
  push:
    branches: [dynasty-patch13-source-trust-20260816]
permissions:
  contents: write
jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply source-trust patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          root=Path('recovered-app')
          def exact(path, old, new):
              p=root/path; s=p.read_text()
              if old not in s: raise SystemExit(f'missing exact target in {path}: {old[:120]!r}')
              p.write_text(s.replace(old,new))
          def regex(path, pattern, repl):
              p=root/path; s=p.read_text(); ns,n=re.subn(pattern,repl,s,flags=re.S)
              if n!=1: raise SystemExit(f'regex {path} matched {n}: {pattern[:100]}')
              p.write_text(ns)

          exact(Path('prisma/schema.prisma'), '  FANTASYCALC\n  STATSGUY\n}', '  FANTASYCALC\n  STATSGUY\n  DYNASTYDEALER\n}')
          exact(Path('src/lib/config.ts'),
                'export const STATSGUY_REFRESH_ENABLED = process.env.STATSGUY_REFRESH_ENABLED !== "false";\nexport const KTC_AUTO_REFRESH_ENABLED = KTC_DIRECT_REFRESH_ENABLED;',
                'export const STATSGUY_REFRESH_ENABLED = process.env.STATSGUY_REFRESH_ENABLED !== "false";\nexport const DYNASTYDEALER_REFRESH_ENABLED = process.env.DYNASTYDEALER_REFRESH_ENABLED !== "false";\nexport const KTC_AUTO_REFRESH_ENABLED = KTC_DIRECT_REFRESH_ENABLED;')
          regex(Path('src/lib/config.ts'),
                r'// KTC is the canonical market-value scale\.[\s\S]*?export const CONSENSUS_WEIGHTS = \{\n  KTC: 0\.75,\n  STATSGUY: 0\.25,\n\} as const;',
                '''// KTC is the canonical market-value scale. Independent secondary markets are\n// translated onto KTC scale, but KTC remains the anchor. Per-player reliability\n// gates can reduce or exclude a secondary when calibration extrapolates or the\n// source remains implausibly far from the live KTC observation.\nexport const CONSENSUS_WEIGHTS = {\n  KTC: 0.70,\n  STATSGUY: 0.15,\n  DYNASTYDEALER: 0.15,\n} as const;''')

          p=root/'src/lib/marketSources.ts'; s=p.read_text()
          s=s.replace('  MARKET_SOURCE_MAX_AGE_MS,\n  STATSGUY_REFRESH_ENABLED,', '  MARKET_SOURCE_MAX_AGE_MS,\n  STATSGUY_REFRESH_ENABLED,\n  DYNASTYDEALER_REFRESH_ENABLED,')
          s=s.replace('export type MarketSourceKey = "KTC" | "STATSGUY";', 'export type MarketSourceKey = "KTC" | "STATSGUY" | "DYNASTYDEALER";')
          s=s.replace('  statsGuyCalibrationPairs: number;\n}', '  statsGuyCalibrationPairs: number;\n  dynastyDealerCalibrationPairs: number;\n}')
          s=s.replace('const STATSGUY_URL = "https://api.statsguyfantasy.com/api/v1/players";\nconst MIN_PROVIDER_ROWS', 'const STATSGUY_URL = "https://api.statsguyfantasy.com/api/v1/players";\nconst DYNASTYDEALER_URL = "https://www.dynastydealer.com/api/player-values";\nconst MIN_PROVIDER_ROWS')
          marker='''  return { source: "STATSGUY", sourceUrl: STATSGUY_URL, fetchedAt, sourceUpdatedAt, rows, message: `Stats Guy Fantasy official API; values as of ${sourceUpdatedAt.toISOString()}` };\n}\n\nasync function currentLeaguePlayers()'''
          insert='''  return { source: "STATSGUY", sourceUrl: STATSGUY_URL, fetchedAt, sourceUpdatedAt, rows, message: `Stats Guy Fantasy official API; values as of ${sourceUpdatedAt.toISOString()}` };\n}\n\ninterface DynastyDealerPlayer {\n  sleeper_id?: string; name?: string; position?: string; team?: string; current_value?: number; base_value?: number; updated_at?: string; votes?: number; age?: number;\n}\ninterface DynastyDealerResponse { players?: DynastyDealerPlayer[]; total?: number; timestamp?: string; }\n\nexport async function fetchDynastyDealerSnapshot(): Promise<ProviderSnapshot> {\n  const fetchedAt = new Date();\n  const response = await fetch(DYNASTYDEALER_URL, { cache: "no-store", signal: withTimeout(20000), headers: { Accept: "application/json", "Cache-Control": "no-cache" } });\n  if (!response.ok) throw new Error(`Dynasty Dealer API failed (${response.status})`);\n  const data = await response.json() as DynastyDealerResponse;\n  if (!data.timestamp) throw new Error("Dynasty Dealer did not return a dataset timestamp");\n  const sourceUpdatedAt = new Date(data.timestamp);\n  assertFresh("Dynasty Dealer", sourceUpdatedAt, fetchedAt);\n  const counters = new Map<string, number>();\n  const players = Array.isArray(data.players) ? data.players : [];\n  const rows: ProviderRow[] = players.flatMap((player, index) => {\n    const value = Number(player.current_value);\n    const name = player.name?.trim();\n    const position = player.position?.toUpperCase();\n    if (!player.sleeper_id || !name || !position || !["QB","RB","WR","TE"].includes(position) || !Number.isFinite(value) || value < 0) return [];\n    const pr = (counters.get(position) ?? 0) + 1; counters.set(position, pr);\n    return [{ sleeperId:String(player.sleeper_id), name, position, team:player.team, rawValue:Math.round(value), rank:index+1, positionRank:pr, metadata:{ baseValue:player.base_value ?? null, votes:player.votes ?? null, rowUpdatedAt:player.updated_at ?? null, age:player.age ?? null } }];\n  });\n  if (rows.length < MIN_PROVIDER_ROWS) throw new Error(`Dynasty Dealer returned only ${rows.length} valued players; refusing partial snapshot`);\n  return { source:"DYNASTYDEALER", sourceUrl:DYNASTYDEALER_URL, fetchedAt, sourceUpdatedAt, rows, message:`Dynasty Dealer public API; ${rows.length} players; trade-market dataset timestamp ${sourceUpdatedAt.toISOString()}` };\n}\n\nasync function currentLeaguePlayers()'''
          if marker not in s: raise SystemExit('missing Stats Guy insertion marker')
          s=s.replace(marker,insert)
          s=s.replace('async function persistStatsGuy(snapshot: ProviderSnapshot, refreshRunId: string): Promise<number> {', 'async function persistSecondary(snapshot: ProviderSnapshot, refreshRunId: string): Promise<number> {')
          # Only alter the secondary persistence function block.
          a=s.index('async function persistSecondary('); b=s.index('\nfunction quantile(',a)
          block=s[a:b].replace('source: "STATSGUY",','source: snapshot.source,').replace('normalizedValue: row.rawValue, // overwritten by same-refresh KTC calibration below.','normalizedValue: 0, // becomes usable only after same-refresh KTC calibration below.').replace('scale: "STATSGUY_RAW_PENDING_KTC_CALIBRATION"','scale: `${snapshot.source}_RAW_PENDING_KTC_CALIBRATION`')
          s=s[:a]+block+s[b:]
          s=s.replace('function applyQuantileMap(map: QuantileMap, value: number): number {\n  const { xs, ys } = map;\n  if (value <= xs[0]) return Math.round(ys[0]);\n  if (value >= xs[xs.length - 1]) return Math.round(ys[ys.length - 1]);', '''function applyQuantileMap(map: QuantileMap, value: number): number {\n  const { xs, ys } = map;\n  if (value <= xs[0]) {\n    const span = Math.max(1e-9, xs[1]-xs[0]);\n    const linear = ys[0] + ((value-xs[0])/span) * (ys[1]-ys[0]);\n    const proportional = xs[0] > 0 ? ys[0] * Math.max(0,value) / xs[0] : linear;\n    return Math.max(0, Math.round(Math.min(linear, proportional)));\n  }\n  if (value >= xs[xs.length - 1]) {\n    const n=xs.length; const span=Math.max(1e-9,xs[n-1]-xs[n-2]);\n    const linear=ys[n-1]+((value-xs[n-1])/span)*(ys[n-1]-ys[n-2]);\n    return Math.min(10000,Math.round(Math.max(ys[n-1],linear)));\n  }''')
          s=s.replace('async function calibrateStatsGuyToKtc(', 'async function calibrateSecondaryToKtc(')
          s=s.replace('  statsGuySnapshot: ProviderSnapshot,\n): Promise<number> {', '  secondarySnapshot: ProviderSnapshot,\n): Promise<number> {')
          ca=s.index('async function calibrateSecondaryToKtc('); cb=s.index('\nasync function buildConsensus(',ca)
          cal=s[ca:cb].replace('statsGuySnapshot.rows','secondarySnapshot.rows').replace("where:{refreshRunId,source:'STATSGUY'},",'where:{refreshRunId,source:secondarySnapshot.source},').replace('const sgRows=','const secondaryRows=').replace('for(const sg of sgRows as any[])','for(const sg of secondaryRows as any[])').replace('rawStatsGuyValue:sg.rawValue,','rawSourceValue:sg.rawValue,\n        sourceName:secondarySnapshot.source,')
          cal=cal.replace('const equivalent=Math.max(0,Math.min(10000,applyQuantileMap(map,sg.rawValue)));','const extrapolated=sg.rawValue<map.xs[0]||sg.rawValue>map.xs[map.xs.length-1];\n    const equivalent=Math.max(0,Math.min(10000,applyQuantileMap(map,sg.rawValue)));')
          cal=cal.replace('ktcEquivalentValue:equivalent,','ktcEquivalentValue:equivalent,\n        calibrationExtrapolated:extrapolated,')
          s=s[:ca]+cal+s[cb:]
          # Replace consensus with reliability-gated three-source consensus.
          start=s.index('async function buildConsensus('); end=s.index('\nfunction disabledStatus(',start)
          consensus='''async function buildConsensus(refreshRunId: string, observedAt = new Date()): Promise<number> {\n  const observations = await marketDb.marketObservation.findMany({ where: { refreshRunId } });\n  const byPlayer = new Map<string, any[]>();\n  for (const obs of observations) { const list=byPlayer.get(obs.playerId)??[]; list.push(obs); byPlayer.set(obs.playerId,list); }\n  let stored=0;\n  for (const [playerId,list] of byPlayer) {\n    const fresh=list.filter((o:any)=>{\n      if(!["KTC","STATSGUY","DYNASTYDEALER"].includes(o.source)) return false;\n      const anchor=o.sourceUpdatedAt??o.observedAt;\n      return observedAt.getTime()-anchor.getTime()<=MARKET_SOURCE_MAX_AGE_MS;\n    });\n    const ktc=fresh.find((o:any)=>o.source==="KTC");\n    if(!ktc) continue;\n    const weighted:{obs:any;base:number;reliability:number}[]=[{obs:ktc,base:CONSENSUS_WEIGHTS.KTC,reliability:1}];\n    for(const obs of fresh.filter((o:any)=>o.source!=="KTC")){\n      let meta:Record<string,unknown>={}; try{meta=JSON.parse(obs.metadata||'{}')}catch{}\n      if(meta.scale!=="KTC_EQUIVALENT"||meta.calibrationExtrapolated===true) continue;\n      const gap=Math.abs(obs.normalizedValue-ktc.normalizedValue)/Math.max(1,Math.abs(ktc.normalizedValue));\n      if(gap>1) continue; // an >100% disagreement is diagnostic, not consensus evidence.\n      const reliability=gap>0.60?0.25:gap>0.35?0.55:1;\n      const base=CONSENSUS_WEIGHTS[obs.source as keyof typeof CONSENSUS_WEIGHTS]??0;\n      if(base>0) weighted.push({obs,base,reliability});\n    }\n    if(weighted.length<2) continue;\n    const denom=weighted.reduce((sum,x)=>sum+x.base*x.reliability,0); if(denom<=0) continue;\n    const effectiveWeights:Record<string,number>={}; let value=0;\n    for(const x of weighted){const w=x.base*x.reliability/denom;effectiveWeights[x.obs.source]=w;value+=x.obs.normalizedValue*w;}\n    const sources=weighted.map((x)=>x.obs.source);\n    await marketDb.consensusObservation.upsert({ where:{playerId_refreshRunId:{playerId,refreshRunId}}, update:{}, create:{playerId,value:Math.round(value),observedAt,refreshRunId,sourcesUsed:JSON.stringify(sources),sourceCount:sources.length,weights:JSON.stringify(effectiveWeights)} });\n    stored++;\n  }\n  return stored;\n}\n'''
          s=s[:start]+consensus+s[end:]
          # Replace refresh orchestration with three providers.
          start=s.index('export async function refreshLiveMarketSources('); end=s.index('\nexport interface CurrentMarketMix',start)
          refresh='''export async function refreshLiveMarketSources(refreshRunId: string): Promise<MarketRefreshResult> {\n  const [ktcResult,sgResult,ddResult]=await Promise.allSettled([\n    KTC_DIRECT_REFRESH_ENABLED?fetchKtcSnapshot():Promise.reject(new Error("KTC disabled")),\n    STATSGUY_REFRESH_ENABLED?fetchStatsGuySnapshot():Promise.reject(new Error("Stats Guy disabled")),\n    DYNASTYDEALER_REFRESH_ENABLED?fetchDynastyDealerSnapshot():Promise.reject(new Error("Dynasty Dealer disabled")),\n  ]);\n  const statuses:MarketSourceStatus[]=[]; let pickStored=0;\n  if(ktcResult.status==="fulfilled"){const snap=ktcResult.value;try{assertFresh("KTC",snap.sourceUpdatedAt,snap.fetchedAt);pickStored=await persistDraftPickObservations(snap,refreshRunId);const stored=await persistKtc(snap,refreshRunId);statuses.push({source:"KTC",enabled:true,ok:true,eligibleForConsensus:true,fetchedAt:snap.fetchedAt.toISOString(),sourceUpdatedAt:snap.sourceUpdatedAt.toISOString(),sourceAgeMs:sourceAge(snap.sourceUpdatedAt,snap.fetchedAt),rowsReceived:snap.rows.length,rowsStored:stored,message:`${snap.message}; ${pickStored} KTC draft-pick buckets stored`});}catch(err){statuses.push({source:"KTC",enabled:true,ok:false,eligibleForConsensus:false,fetchedAt:new Date().toISOString(),sourceUpdatedAt:null,sourceAgeMs:null,rowsReceived:0,rowsStored:0,message:err instanceof Error?err.message:String(err)});}}\n  else statuses.push({source:"KTC",enabled:KTC_DIRECT_REFRESH_ENABLED,ok:false,eligibleForConsensus:false,fetchedAt:new Date().toISOString(),sourceUpdatedAt:null,sourceAgeMs:null,rowsReceived:0,rowsStored:0,message:ktcResult.reason instanceof Error?ktcResult.reason.message:String(ktcResult.reason)});\n  async function finishSecondary(result:PromiseSettledResult<ProviderSnapshot>,source:"STATSGUY"|"DYNASTYDEALER",enabled:boolean,label:string){\n    if(result.status==="fulfilled"){const snap=result.value;try{assertFresh(label,snap.sourceUpdatedAt,snap.fetchedAt);const stored=await persistSecondary(snap,refreshRunId);statuses.push({source,enabled:true,ok:true,eligibleForConsensus:true,fetchedAt:snap.fetchedAt.toISOString(),sourceUpdatedAt:snap.sourceUpdatedAt.toISOString(),sourceAgeMs:sourceAge(snap.sourceUpdatedAt,snap.fetchedAt),rowsReceived:snap.rows.length,rowsStored:stored,message:snap.message});}catch(err){statuses.push({source,enabled:true,ok:false,eligibleForConsensus:false,fetchedAt:new Date().toISOString(),sourceUpdatedAt:null,sourceAgeMs:null,rowsReceived:0,rowsStored:0,message:err instanceof Error?err.message:String(err)});}}\n    else statuses.push({source,enabled,ok:false,eligibleForConsensus:false,fetchedAt:new Date().toISOString(),sourceUpdatedAt:null,sourceAgeMs:null,rowsReceived:0,rowsStored:0,message:result.reason instanceof Error?result.reason.message:String(result.reason)});\n  }\n  await finishSecondary(sgResult,"STATSGUY",STATSGUY_REFRESH_ENABLED,"Stats Guy");\n  await finishSecondary(ddResult,"DYNASTYDEALER",DYNASTYDEALER_REFRESH_ENABLED,"Dynasty Dealer");\n  let sgPairs=0,ddPairs=0;\n  if(ktcResult.status==="fulfilled"&&statuses.find((x)=>x.source==="KTC")?.ok){\n    if(sgResult.status==="fulfilled"&&statuses.find((x)=>x.source==="STATSGUY")?.ok){sgPairs=await calibrateSecondaryToKtc(refreshRunId,ktcResult.value,sgResult.value);const st=statuses.find((x)=>x.source==="STATSGUY");if(st)st.message+=`; ${sgPairs} same-refresh pairs calibrated to KTC scale`; }\n    if(ddResult.status==="fulfilled"&&statuses.find((x)=>x.source==="DYNASTYDEALER")?.ok){ddPairs=await calibrateSecondaryToKtc(refreshRunId,ktcResult.value,ddResult.value);const st=statuses.find((x)=>x.source==="DYNASTYDEALER");if(st)st.message+=`; ${ddPairs} same-refresh pairs calibrated to KTC scale`; }\n  }\n  const consensusPlayersStored=(sgPairs+ddPairs)>0?await buildConsensus(refreshRunId):0;\n  return {statuses,consensusPlayersStored,marketObservationsStored:statuses.reduce((sum,x)=>sum+x.rowsStored,0),draftPickObservationsStored:pickStored,statsGuyCalibrationPairs:sgPairs,dynastyDealerCalibrationPairs:ddPairs};\n}\n'''
          s=s[:start]+refresh+s[end:]
          # Replace market-mix tail to expose both secondaries and require calibrated metadata.
          start=s.index('export interface CurrentMarketMix')
          tail='''export interface CurrentMarketMix {\n  playerId:string; consensusValue:number|null; consensusObservedAt:string|null; consensusSourceCount:number; consensusSources:string[]; ktcValue:number|null;\n  statsGuyValue:number|null; statsGuyRawValue:number|null; dynastyDealerValue:number|null; dynastyDealerRawValue:number|null;\n}\nexport async function getCurrentMarketMix(playerIds:string[]):Promise<Map<string,CurrentMarketMix>>{\n  const result=new Map<string,CurrentMarketMix>();\n  for(const playerId of playerIds)result.set(playerId,{playerId,consensusValue:null,consensusObservedAt:null,consensusSourceCount:0,consensusSources:[],ktcValue:null,statsGuyValue:null,statsGuyRawValue:null,dynastyDealerValue:null,dynastyDealerRawValue:null});\n  if(!playerIds.length)return result;\n  const [consensus,market]=await Promise.all([marketDb.consensusObservation.findMany({where:{playerId:{in:playerIds}},orderBy:{observedAt:"desc"}}),marketDb.marketObservation.findMany({where:{playerId:{in:playerIds}},orderBy:{observedAt:"desc"}})]);\n  const seenConsensus=new Set<string>();\n  for(const c of consensus as any[]){if(seenConsensus.has(c.playerId)||Date.now()-c.observedAt.getTime()>MARKET_SOURCE_MAX_AGE_MS)continue;let sources:string[]=[];try{sources=JSON.parse(c.sourcesUsed)}catch{}if(!sources.includes("KTC")||sources.length<2)continue;seenConsensus.add(c.playerId);const row=result.get(c.playerId)!;row.consensusValue=c.value;row.consensusObservedAt=c.observedAt.toISOString();row.consensusSourceCount=c.sourceCount;row.consensusSources=sources;}\n  const seenSource=new Set<string>();\n  for(const m of market as any[]){if(!["KTC","STATSGUY","DYNASTYDEALER"].includes(m.source))continue;const key=`${m.playerId}:${m.source}`;if(seenSource.has(key))continue;const anchor=m.sourceUpdatedAt??m.observedAt;if(Date.now()-anchor.getTime()>MARKET_SOURCE_MAX_AGE_MS)continue;seenSource.add(key);const row=result.get(m.playerId)!;if(m.source==="KTC"){row.ktcValue=m.rawValue;continue;}let meta:Record<string,unknown>={};try{meta=JSON.parse(m.metadata||'{}')}catch{};if(m.source==="STATSGUY"){row.statsGuyRawValue=m.rawValue;if(meta.scale==="KTC_EQUIVALENT")row.statsGuyValue=m.normalizedValue;}if(m.source==="DYNASTYDEALER"){row.dynastyDealerRawValue=m.rawValue;if(meta.scale==="KTC_EQUIVALENT")row.dynastyDealerValue=m.normalizedValue;}}\n  return result;\n}\nexport async function getLatestMarketSourceStatuses():Promise<Record<MarketSourceKey,{observedAt:string|null;sourceUpdatedAt:string|null;ageMs:number|null;stale:boolean}>>{\n  const out={} as Record<MarketSourceKey,{observedAt:string|null;sourceUpdatedAt:string|null;ageMs:number|null;stale:boolean}>;\n  for(const source of ["KTC","STATSGUY","DYNASTYDEALER"] as MarketSourceKey[]){const obs=await marketDb.marketObservation.findFirst({where:{source},orderBy:{observedAt:"desc"}});const anchor=obs?.sourceUpdatedAt??obs?.observedAt??null;const ageMs=anchor?Date.now()-anchor.getTime():null;out[source]={observedAt:obs?.observedAt.toISOString()??null,sourceUpdatedAt:obs?.sourceUpdatedAt?.toISOString()??null,ageMs,stale:ageMs===null||ageMs>MARKET_SOURCE_MAX_AGE_MS};}\n  return out;\n}\n'''
          s=s[:start]+tail
          p.write_text(s)

          exact(Path('src/lib/refresh.ts'), '  const requestedSources = ["sleeper", "ktc", "statsguy", "consensus", "nflverse-context"];', '  const requestedSources = ["sleeper", "ktc", "statsguy", "dynastydealer", "consensus", "nflverse-context"];')
          # Signal entries expose the third source for UI, while the existing rules engine remains conservative.
          exact(Path('src/lib/signalsEngine.ts'), '  statsGuyRawValue: number | null;\n}', '  statsGuyRawValue: number | null;\n  dynastyDealerValue: number | null;\n  dynastyDealerRawValue: number | null;\n}')
          exact(Path('src/lib/signalsEngine.ts'), 'out.set(e.playerId, { result: computeSignal(market, ctx), market, football, statsGuyValue: mix.statsGuyValue, statsGuyRawValue: mix.statsGuyRawValue });', 'out.set(e.playerId, { result: computeSignal(market, ctx), market, football, statsGuyValue: mix.statsGuyValue, statsGuyRawValue: mix.statsGuyRawValue, dynastyDealerValue: mix.dynastyDealerValue, dynastyDealerRawValue: mix.dynastyDealerRawValue });')

          # Settings: source health is now three-way and explicitly describes reliability gating.
          sp=root/'src/app/(app)/settings/page.tsx'; ss=sp.read_text()
          ss=ss.replace('ORLANDO_OSWALDS_SLEEPER_USER_ID, STATSGUY_REFRESH_ENABLED, DISPLAY_TIMEZONE', 'ORLANDO_OSWALDS_SLEEPER_USER_ID, STATSGUY_REFRESH_ENABLED, DYNASTYDEALER_REFRESH_ENABLED, DISPLAY_TIMEZONE')
          ss=ss.replace('    { key:"STATSGUY" as const, enabled:STATSGUY_REFRESH_ENABLED, label:"Stats Guy Fantasy", detail:"Secondary live market source · official API · sf_dynasty freshness must pass the cutoff · raw scores are translated onto KTC scale before consensus" },\n  ];', '    { key:"STATSGUY" as const, enabled:STATSGUY_REFRESH_ENABLED, label:"Stats Guy Fantasy", detail:"Independent daily market source · official API · translated onto KTC scale only from same-refresh overlap" },\n    { key:"DYNASTYDEALER" as const, enabled:DYNASTYDEALER_REFRESH_ENABLED, label:"Dynasty Dealer", detail:"Independent real-Sleeper-trade market · public API · translated onto KTC scale and reliability-gated per player" },\n  ];')
          ss=ss.replace('Build: PATCH 12 · preserves DECISION CENTER + QOL PATCH 11', 'Build: PATCH 13 · preserves PATCH 11 UX + PATCH 12 recovery')
          ss=ss.replace('KTC is the 75% anchor; Stats Guy is 25% after same-refresh position-aware quantile calibration onto the KTC scale. Raw Stats Guy numbers are never averaged directly with KTC.', 'KTC is the 70% anchor. Stats Guy and Dynasty Dealer each start at 15% after same-refresh position-aware calibration onto the KTC scale. A secondary is downweighted or excluded per player when the calibration is extrapolated or it remains implausibly far from live KTC; raw source numbers are never averaged directly with KTC.')
          ss=ss.replace('</details>\n    </div>', '</details><p className="mt-3 text-[10px] text-neutral-600">Third-source attribution: <a className="underline hover:text-neutral-300" href="https://www.dynastydealer.com" target="_blank" rel="noreferrer">Values by Dynasty Dealer</a>.</p>\n    </div>',1)
          sp.write_text(ss)

          # Player detail: show both secondary markets and use the largest calibrated gap as a review flag.
          pp=root/'src/app/(app)/players/[id]/page.tsx'; ps=pp.read_text()
          old='''  const sourceGap = market.currentValue && signalEntry?.statsGuyValue !== null && signalEntry?.statsGuyValue !== undefined\n    ? ((signalEntry.statsGuyValue - market.currentValue) / market.currentValue) * 100\n    : null;'''
          new='''  const sourceCandidates = [\n    { label:"SG→KTC", value:signalEntry?.statsGuyValue ?? null },\n    { label:"DD→KTC", value:signalEntry?.dynastyDealerValue ?? null },\n  ].filter((x): x is {label:string;value:number} => market.currentValue !== null && market.currentValue > 0 && x.value !== null);\n  const sourceGapEntry = sourceCandidates.map((x)=>({ ...x, gap:((x.value-market.currentValue!)/market.currentValue!)*100 })).sort((a,b)=>Math.abs(b.gap)-Math.abs(a.gap))[0] ?? null;\n  const sourceGap = sourceGapEntry?.gap ?? null;'''
          if old not in ps: raise SystemExit('player sourceGap block missing')
          ps=ps.replace(old,new)
          ps=ps.replace('<div className="metric-sub">SG→KTC versus KTC</div>', '<div className="metric-sub">{sourceGapEntry ? `${sourceGapEntry.label} versus KTC · review flag, not advice` : "no trusted cross-source comparison"}</div>')
          ps=ps.replace('text-[10px] text-neutral-600">This is a live rules-based dynasty signal, recalculated from saved KTC history, current roster/depth context, fresh Stats Guy → KTC scale market data, and nflverse production data when the current NFL season has games.', 'text-[10px] text-neutral-600">This is a live rules-based dynasty signal, recalculated from saved KTC history, current roster/depth context, independently refreshed market cross-checks, and nflverse production data when the current NFL season has games.')
          ps=ps.replace('className="grid grid-cols-2 gap-3 md:grid-cols-5"', 'className="grid grid-cols-2 gap-3 md:grid-cols-6"',1)
          needle='''        <div className="rounded-lg border border-neutral-800 bg-neutral-900 p-4">\n          <p className="text-[11px] uppercase tracking-wide text-neutral-500">Stats Guy → KTC scale</p>\n          <p className="mt-1 text-2xl font-semibold text-emerald-300">{formatPoints(signalEntry?.statsGuyValue ?? null)}</p>\n          <p className="text-[11px] text-neutral-600">KTC-equivalent after same-refresh scale calibration{signalEntry?.statsGuyRawValue !== null && signalEntry?.statsGuyRawValue !== undefined ? ` · raw secondary ${signalEntry.statsGuyRawValue.toLocaleString()}` : ""}</p>\n        </div>'''
          replacement=needle+'''\n        <div className="rounded-lg border border-neutral-800 bg-neutral-900 p-4">\n          <p className="text-[11px] uppercase tracking-wide text-neutral-500">Dynasty Dealer → KTC scale</p>\n          <p className="mt-1 text-2xl font-semibold text-sky-300">{formatPoints(signalEntry?.dynastyDealerValue ?? null)}</p>\n          <p className="text-[11px] text-neutral-600">Real-trade-market cross-check after same-refresh KTC calibration{signalEntry?.dynastyDealerRawValue !== null && signalEntry?.dynastyDealerRawValue !== undefined ? ` · raw DD ${signalEntry.dynastyDealerRawValue.toLocaleString()}` : ""}</p>\n        </div>'''
          if needle not in ps: raise SystemExit('player SG card missing')
          ps=ps.replace(needle,replacement)
          pp.write_text(ps)

          # League disagreement board evaluates both secondaries and names the source creating the gap.
          lp=root/'src/app/(app)/league/page.tsx'; ls=lp.read_text()
          old='''  const disagreement = entries.map((e) => {\n    const mix = marketMix.get(e.playerId);\n    const ktc = marketData.get(e.playerId)?.currentValue ?? null;\n    return { e, ktc, sg: mix?.statsGuyValue ?? null, gap: sourceGapPct(ktc, mix?.statsGuyValue ?? null) };\n  }).filter((x): x is typeof x & { gap: number } => x.gap !== null)\n    .sort((a, b) => Math.abs(b.gap) - Math.abs(a.gap)).slice(0, 8);'''
          new='''  const disagreement = entries.map((e) => {\n    const mix=marketMix.get(e.playerId); const ktc=marketData.get(e.playerId)?.currentValue??null;\n    const candidates=[{source:"Stats Guy",value:mix?.statsGuyValue??null},{source:"Dynasty Dealer",value:mix?.dynastyDealerValue??null}]\n      .map((x)=>({...x,gap:sourceGapPct(ktc,x.value)})).filter((x):x is typeof x & {gap:number}=>x.gap!==null).sort((a,b)=>Math.abs(b.gap)-Math.abs(a.gap));\n    const largest=candidates[0]??null; return {e,ktc,source:largest?.source??null,secondary:largest?.value??null,gap:largest?.gap??null};\n  }).filter((x): x is typeof x & { gap: number; source:string; secondary:number } => x.gap !== null && x.source !== null && x.secondary !== null)\n    .sort((a,b)=>Math.abs(b.gap)-Math.abs(a.gap)).slice(0,8);'''
          if old not in ls: raise SystemExit('league disagreement block missing')
          ls=ls.replace(old,new)
          ls=ls.replace('where the two fresh market sources disagree enough to deserve a second look.', 'where independently refreshed market sources disagree enough to deserve a second look.')
          ls=ls.replace('Stats Guy is translated onto the KTC scale first. Large gaps identify players where the markets disagree, not automatic buys or sells.', 'Stats Guy and Dynasty Dealer are independently translated onto the KTC scale first. Extreme or extrapolated gaps are excluded from consensus; this board is a review queue, not a buy/sell list.')
          ls=ls.replace('disagreement.map(({ e, ktc, sg, gap })', 'disagreement.map(({ e, ktc, source, secondary, gap })')
          ls=ls.replace('KTC {formatPoints(ktc)} · SG→KTC {formatPoints(sg)}', 'KTC {formatPoints(ktc)} · {source}→KTC {formatPoints(secondary)}')
          lp.write_text(ls)
          print('Patch 13 source-trust code applied')
          PY
      - name: Install and validate
        working-directory: recovered-app
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/postgres
          BACKUP_DATABASE_URL: postgresql://user:pass@localhost:5432/postgres
          STATSGUY_REFRESH_ENABLED: "true"
          DYNASTYDEALER_REFRESH_ENABLED: "true"
        run: |
          npm install --ignore-scripts
          npx prisma generate
          npx tsc --noEmit
          npm run build
      - name: Commit Patch 13 source
        shell: bash
        run: |
          git config user.name 'ChatGPT Dashboard Patch'
          git config user.email 'actions@users.noreply.github.com'
          git add recovered-app
          if git diff --cached --quiet; then echo 'No source changes'; else git commit -m 'Patch 13: multi-source trust, Dynasty Dealer, disagreement gating'; git push; fi

name: patch13-source-trust
on:
  push:
    branches: [dynasty-patch13-source-trust-20260816]
permissions:
  contents: read
jobs:
  validate-recovered-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: recovered-app
        run: npm install
      - name: Generate Prisma client
        working-directory: recovered-app
        run: npx prisma generate
      - name: Typecheck and build
        working-directory: recovered-app
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          SESSION_PASSWORD: 12345678901234567890123456789012
        run: npm run build

name: fetch-p14-neon-bridge-ciphertext
on:
  push:
    paths: ['.github/workflows/fetch-p14-neon-bridge-ciphertext.yml']
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch encrypted bridge payload
        run: |
          set -euo pipefail
          url='https://dynasty-boys-dashboard.vercel.app/api/neon-bridge-bootstrap-p14-c8f2a1'
          stamp=$(date +%s%N)
          curl -fsSL --max-time 30 -H 'Cache-Control: no-cache, no-store' "${url}?probe=${stamp}"
          echo

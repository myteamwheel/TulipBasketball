name: probe-railway-live-p14
on:
  push:
    paths: ['.github/workflows/probe-railway-live-p14.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe live Railway dashboard
        run: |
          set +e
          base='https://tulipbasketball.up.railway.app'
          for p in '/healthz' '/api/debug-home' '/' '/settings'; do
            echo "===== $p ====="
            curl -sS -L --max-time 45 -D /tmp/h -o /tmp/b "${base}${p}?probe=$(date +%s%N)"
            echo "status=$(awk 'toupper($1) ~ /^HTTP\// {c=$2} END {print c}' /tmp/h)"
            head -c 3000 /tmp/b || true
            echo
          done

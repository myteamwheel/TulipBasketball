name: probe-db-candidates

on:
  push:
    paths: ['.github/workflows/probe-db-candidates.yml']
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Read safe database candidate audit
        shell: bash
        run: |
          set +e
          base='https://dynasty-boys-dashboard.vercel.app'
          for path in '/api/recovery-old-db-audit' '/api/db-env-diagnostic'; do
            echo "===== $path ====="
            curl -sS -L --max-time 30 -H 'Cache-Control: no-cache' "${base}${path}?probe=$(date +%s%N)"
            echo
          done

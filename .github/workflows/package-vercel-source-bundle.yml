name: package-vercel-source-bundle
on:
  push:
    paths: ['.github/workflows/package-vercel-source-bundle.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source-only recovered app
        shell: bash
        run: |
          set -euo pipefail
          rm -rf deploy-bundle
          mkdir -p deploy-bundle
          tar -czf /tmp/recovered-app-source.tar.gz \
            --exclude='recovered-app/.next' \
            --exclude='recovered-app/node_modules' \
            --exclude='recovered-app/.env' \
            --exclude='recovered-app/.env.*' \
            recovered-app
          base64 -w0 /tmp/recovered-app-source.tar.gz > /tmp/bundle.b64
          split -b 600000 -d -a 3 /tmp/bundle.b64 deploy-bundle/bundle.part.
          bytes=$(wc -c < /tmp/recovered-app-source.tar.gz | tr -d ' ')
          b64bytes=$(wc -c < /tmp/bundle.b64 | tr -d ' ')
          sha=$(sha256sum /tmp/recovered-app-source.tar.gz | awk '{print $1}')
          parts=$(find deploy-bundle -type f -name 'bundle.part.*' | wc -l | tr -d ' ')
          printf '{"archive_bytes":%s,"base64_bytes":%s,"parts":%s,"sha256":"%s"}\n' "$bytes" "$b64bytes" "$parts" "$sha" > deploy-bundle/metadata.json
          ls -lh deploy-bundle
      - name: Commit bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy-bundle
          git commit -m 'Package recovered dashboard for direct Vercel deployment' || exit 0
          git push

name: Verify Patch 11 Live

on:
  push:
    branches: [dynasty-patch11-command-center]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel production promotion
        run: sleep 90
      - name: Verify public Patch 11 marker
        run: |
          set -e
          curl -fsSL --max-time 30 https://dynasty-boys-dashboard.vercel.app/settings -o /tmp/settings.html
          grep -q 'COMMAND CENTER + UX PATCH 11' /tmp/settings.html
          echo 'Patch 11 marker found on public production settings page.'

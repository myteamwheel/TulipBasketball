name: probe-vercel-runtime-p14

on:
  push:
    paths: ['.github/workflows/probe-vercel-runtime-p14.yml']
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for safe DB diagnostic then capture runtime
        shell: bash
        run: |
          set +e
          base='https://dynasty-boys-dashboard.vercel.app'
          for attempt in $(seq 1 30); do
            stamp="$(date +%s%N)"
            code=$(curl -sS --max-time 30 -o /tmp/dbdiag -w '%{http_code}' -H 'Cache-Control: no-cache' "${base}/api/db-env-diagnostic?probe=${stamp}")
            echo "diagnostic attempt ${attempt}/30 status=${code}"
            if [ "$code" = "200" ]; then
              cat /tmp/dbdiag
              echo
              break
            fi
            sleep 10
          done
          for path in '/healthz' '/api/debug-home' '/'; do
            echo "===== ${path} ====="
            stamp="$(date +%s%N)"
            curl -sS -L --max-time 30 -D /tmp/headers -o /tmp/body -H 'Cache-Control: no-cache' "${base}${path}?probe=${stamp}"
            rc=$?
            status=$(awk 'toupper($1) ~ /^HTTP\// {code=$2} END {print code}' /tmp/headers)
            echo "curl_exit=${rc} status=${status}"
            grep -Ei '^(HTTP/|content-type:|cache-control:|location:|x-vercel|x-matched-path:|x-nextjs|server:)' /tmp/headers | tail -30 || true
            echo '--- BODY ---'
            head -c 4000 /tmp/body || true
            echo
          done

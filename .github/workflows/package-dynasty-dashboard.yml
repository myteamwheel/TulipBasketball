name: package-dynasty-dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package recovered dashboard
        run: |
          tar -czf dynasty-dashboard-source.tar.gz recovered-app
      - uses: actions/upload-artifact@v4
        with:
          name: dynasty-dashboard-source
          path: dynasty-dashboard-source.tar.gz
          retention-days: 7

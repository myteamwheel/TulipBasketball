name: probe-recovered-vercel-p14
on:
  push:
    paths: ['.github/workflows/probe-recovered-vercel-p14.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe prior-deployment Neon redeploy
        run: |
          set +e
          for base in \
            'https://dynasty-boys-dashboard-myteamwheel-8058s-projects.vercel.app' \
            'https://dynasty-boys-dashboard.vercel.app'; do
            echo "######## ${base} ########"
            for i in $(seq 1 12); do
              echo "===== attempt $i ====="
              h=$(curl -sS -L --max-time 30 -o /tmp/health -w '%{http_code}' "${base}/healthz?probe=$(date +%s%N)" || true)
              d=$(curl -sS -L --max-time 30 -o /tmp/debug -w '%{http_code}' "${base}/api/debug-home?probe=$(date +%s%N)" || true)
              s=$(curl -sS -L --max-time 30 -o /tmp/settings -w '%{http_code}' "${base}/settings?probe=$(date +%s%N)" || true)
              echo "health=$h debug=$d settings=$s debug_body=$(head -c 900 /tmp/debug 2>/dev/null | tr '\n' ' ' || true)"
              if [ "$h" = 200 ] && [ "$d" = 200 ] && grep -q '"ok":true' /tmp/debug; then echo "HEALTHY_BASE=$base"; exit 0; fi
              sleep 10
            done
          done
          exit 1

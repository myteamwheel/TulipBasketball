name: probe-recovered-vercel-p14
on:
  push:
    paths: ['.github/workflows/probe-recovered-vercel-p14.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect recovered Vercel dashboard now
        run: |
          set +e
          base='https://dynasty-boys-dashboard-recovered-myteamwheel-8058s-projects.vercel.app'
          for p in '/healthz' '/api/debug-home' '/settings' '/'; do
            echo "===== $p ====="
            curl -sS -L --max-time 30 -D /tmp/h -o /tmp/b "${base}${p}?probe=$(date +%s%N)"
            echo "status=$(awk 'toupper($1) ~ /^HTTP\// {c=$2} END {print c}' /tmp/h)"
            grep -Ei '^(HTTP/|location:|content-type:|x-vercel|server:)' /tmp/h | tail -20 || true
            head -c 2500 /tmp/b || true
            echo
          done

name: probe-recovered-vercel-p14
on:
  push:
    paths: ['.github/workflows/probe-recovered-vercel-p14.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fingerprint live team-scoped Dynasty dashboard
        run: |
          set +e
          base='https://dynasty-boys-dashboard-myteamwheel-8058s-projects.vercel.app'
          for p in '/' '/settings' '/refresh-history' '/players' '/league' '/api/debug-home' '/api/export' '/api/refresh'; do
            echo "===== $p ====="
            curl -sS -L --max-time 30 -D /tmp/h -o /tmp/b "${base}${p}?probe=$(date +%s%N)"
            echo "status=$(awk 'toupper($1) ~ /^HTTP\// {c=$2} END {print c}' /tmp/h) content_type=$(grep -i '^content-type:' /tmp/h | tail -1 | tr -d '\r')"
            for marker in 'PATCH 14' 'PATCH 13' 'PATCH 12' 'PATCH 11' 'Tradyr' 'Stats Guy' 'June 7' 'June 21' 'Biggest KTC changes' 'Data Health' 'Power board' 'decision dashboard' 'Orlando Oswalds'; do
              if grep -Fqi "$marker" /tmp/b; then echo "FOUND: $marker"; fi
            done
            echo "BODY_PREFIX=$(head -c 1200 /tmp/b | tr '\n' ' ')"
            echo
          done

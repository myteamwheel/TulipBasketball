name: probe-recovered-vercel-p14
on:
  push:
    paths: ['.github/workflows/probe-recovered-vercel-p14.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Test Vercel build-time raw GitHub fetch
        run: |
          set +e
          base='https://dynasty-build-fetch-probe-myteamwheel-8058s-projects.vercel.app'
          for i in $(seq 1 12); do
            code=$(curl -sS -L --max-time 30 -o /tmp/b -w '%{http_code}' "${base}/?probe=$(date +%s%N)" || true)
            echo "attempt=$i status=$code body=$(head -c 1000 /tmp/b 2>/dev/null | tr '\n' ' ' || true)"
            if [ "$code" = 200 ] && grep -q 'archive_bytes' /tmp/b; then exit 0; fi
            sleep 10
          done
          exit 1

name: probe-recovered-vercel-p14
on:
  push:
    paths: ['.github/workflows/probe-recovered-vercel-p14.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Wait briefly and inspect recovered Vercel v2
        run: |
          set +e
          base='https://dynasty-boys-dashboard-recovered-v2-myteamwheel-8058s-projects.vercel.app'
          for i in $(seq 1 12); do
            echo "===== attempt $i ====="
            for p in '/healthz' '/api/debug-home' '/settings' '/'; do
              code=$(curl -sS -L --max-time 30 -o /tmp/b -w '%{http_code}' "${base}${p}?probe=$(date +%s%N)" || true)
              echo "$p status=$code body=$(head -c 500 /tmp/b 2>/dev/null | tr '\n' ' ' || true)"
            done
            h=$(curl -sS -L --max-time 30 -o /tmp/health -w '%{http_code}' "${base}/healthz?probe=$(date +%s%N)" || true)
            d=$(curl -sS -L --max-time 30 -o /tmp/debug -w '%{http_code}' "${base}/api/debug-home?probe=$(date +%s%N)" || true)
            s=$(curl -sS -L --max-time 30 -o /tmp/settings -w '%{http_code}' "${base}/settings?probe=$(date +%s%N)" || true)
            if [ "$h" = 200 ] && [ "$d" = 200 ] && grep -q '"ok":true' /tmp/debug && [ "$s" = 200 ]; then
              echo 'RECOVERED V2 HEALTHY'
              exit 0
            fi
            sleep 10
          done
          exit 1

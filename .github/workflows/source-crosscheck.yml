name: source-crosscheck
on:
  push:
    branches: [dynasty-db-diagnostic-probe-20260816]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Compare live source data
        run: |
          node <<'NODE'
          function extractArray(html){for(const marker of [/\bvar\s+playersArray\s*=\s*/,/\blet\s+playersArray\s*=\s*/,/\bconst\s+playersArray\s*=\s*/]){const m=marker.exec(html);if(!m)continue;const open=html.indexOf('[',m.index+m[0].length);if(open<0)continue;let d=0,s=false,e=false;for(let i=open;i<html.length;i++){const c=html[i];if(s){if(e)e=false;else if(c==='\\')e=true;else if(c==='"')s=false;continue;}if(c==='"'){s=true;continue;}if(c==='[')d++;else if(c===']'&&--d===0){try{return JSON.parse(html.slice(open,i+1))}catch{}}}}return []}
          const ktcRes=await fetch('https://keeptradecut.com/dynasty-rankings',{headers:{'user-agent':'Mozilla/5.0','cache-control':'no-cache'}}); const html=await ktcRes.text(); const arr=extractArray(html); const joe=arr.find(x=>String(x.playerName||x.name||'').toLowerCase()==='joe mixon');
          const sg=await (await fetch('https://api.statsguyfantasy.com/api/v1/players',{headers:{'cache-control':'no-cache'}})).json(); const sgJoe=(sg.players||[]).find(x=>String(x.name||'').toLowerCase()==='joe mixon');
          const dd=await (await fetch('https://www.dynastydealer.com/api/player-values',{headers:{'cache-control':'no-cache'}})).json(); const ddJoe=(dd.players||[]).find(x=>String(x.name||'').toLowerCase()==='joe mixon');
          const sv=joe?.superflexValues; const candidates=[sv?.value,sv].filter(Boolean); let kv=null; for(const c of candidates){const v=Number(c?.value);if(Number.isFinite(v)){kv=v;break}}
          console.log('KTC',JSON.stringify({http:ktcRes.status,assets:arr.length,joeFound:!!joe,value:kv,position:joe?.position,team:joe?.team,id:joe?.playerID||joe?.id,fresh:(html.match(/Values updated[^<]{0,80}/i)||[])[0]||null}));
          console.log('STATSGUY',JSON.stringify({asOf:sg.valuesAsOf?.sf_dynasty,total:(sg.players||[]).length,joe:sgJoe&&{id:sgJoe.id,position:sgJoe.position,team:sgJoe.team,value:sgJoe.value?.sf_dynasty,rank:sgJoe.rank?.sf_dynasty,positionRank:sgJoe.positionRank?.sf_dynasty}}));
          console.log('DYNASTYDEALER',JSON.stringify({timestamp:dd.timestamp,total:(dd.players||[]).length,joe:ddJoe&&{id:ddJoe.sleeper_id,position:ddJoe.position,team:ddJoe.team,current_value:ddJoe.current_value,base_value:ddJoe.base_value,updated_at:ddJoe.updated_at,votes:ddJoe.votes}}));
          NODE

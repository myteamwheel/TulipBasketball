name: source-crosscheck
on:
  push:
    branches: [dynasty-db-diagnostic-probe-20260816]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check KTC pagination coverage
        run: |
          node <<'NODE'
          function extractArray(html){for(const marker of [/\bvar\s+playersArray\s*=\s*/,/\blet\s+playersArray\s*=\s*/,/\bconst\s+playersArray\s*=\s*/]){const m=marker.exec(html);if(!m)continue;const open=html.indexOf('[',m.index+m[0].length);if(open<0)continue;let d=0,s=false,e=false;for(let i=open;i<html.length;i++){const c=html[i];if(s){if(e)e=false;else if(c==='\\')e=true;else if(c==='"')s=false;continue;}if(c==='"'){s=true;continue;}if(c==='[')d++;else if(c===']'&&--d===0){try{return JSON.parse(html.slice(open,i+1))}catch{}}}}return []}
          function value(j){const sv=j?.superflexValues;for(const c of [sv?.value,sv]){const n=Number(c?.value);if(Number.isFinite(n))return n}return null}
          for(let page=1;page<=14;page++){
            const path=`/dynasty-rankings?page=${page}`;
            const r=await fetch('https://keeptradecut.com'+path,{headers:{'user-agent':'Mozilla/5.0','cache-control':'no-cache'}});
            const h=await r.text(); const a=extractArray(h); const j=a.find(x=>String(x.playerName||x.name||'').toLowerCase()==='joe mixon');
            const first=a[0], last=a[a.length-1];
            console.log('PAGE',JSON.stringify({page,http:r.status,n:a.length,first:first?.playerName||first?.name,last:last?.playerName||last?.name,joe:!!j,joeValue:value(j),fresh:(h.match(/Values updated[^<]{0,80}/i)||[])[0]||null}));
          }
          const profile=await (await fetch('https://keeptradecut.com/dynasty-rankings/players/joe-mixon-273',{headers:{'user-agent':'Mozilla/5.0','cache-control':'no-cache'}})).text();
          console.log('PROFILE_MATCHES',JSON.stringify({has606:profile.includes('606'),hasJoe:profile.includes('Joe Mixon'),fresh:(profile.match(/Values updated[^<]{0,80}/i)||[])[0]||null,snips:[...profile.matchAll(/Joe Mixon.{0,200}/g)].slice(0,3).map(m=>m[0])}));
          NODE

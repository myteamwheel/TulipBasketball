name: validate-exact12-recovery
on:
  push:
    branches: [dynasty-patch12-exact-recovery-20260816]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconstruct application
        shell: bash
        run: |
          mkdir -p recovered-app
          node <<'NODE'
          const fs=require('fs'),path=require('path'),zlib=require('zlib');
          const baseParts=['payload.0.txt','payload.1.txt','payload.2a.txt','payload.2b.txt','payload.3.txt','payload.4.txt','payload.5.txt','payload.6.txt','payload.7.txt'];
          const basePacked=baseParts.map(f=>fs.readFileSync(path.join('dynasty-patch10',f),'utf8').trim()).join('');
          const base=JSON.parse(zlib.brotliDecompressSync(Buffer.from(basePacked,'base64')).toString('utf8'));
          function apply(payload){for(const [rel,item] of Object.entries(payload)){const d=path.join('recovered-app',rel);if(item.op==='delete'){fs.rmSync(d,{force:true,recursive:true});continue;}fs.mkdirSync(path.dirname(d),{recursive:true});fs.writeFileSync(d,item.encoding==='base64'?Buffer.from(item.data,'base64'):item.data);}}
          apply(base);
          const overlayParts=['part.00','part.01','part.02','part.03','part.04'];
          const overlayPacked=overlayParts.map(f=>fs.readFileSync(path.join('deploy/exact12-overlay',f),'utf8').trim()).join('');
          const overlay=JSON.parse(zlib.brotliDecompressSync(Buffer.from(overlayPacked,'base64')).toString('utf8'));
          apply(overlay);

          const mp=path.join('recovered-app','src/lib/marketSources.ts');
          const marketBefore='if (statuses.find((s)=>s.source==="KTC")?.ok && statuses.find((s)=>s.source==="STATSGUY")?.ok) {';
          const marketAfter='if (ktcResult.status === "fulfilled" && sgResult.status === "fulfilled" && statuses.find((s)=>s.source==="KTC")?.ok && statuses.find((s)=>s.source==="STATSGUY")?.ok) {';
          const marketSrc=fs.readFileSync(mp,'utf8');
          if(!marketSrc.includes(marketBefore)) throw new Error('Patch 12 calibration guard not found');
          fs.writeFileSync(mp,marketSrc.replace(marketBefore,marketAfter));

          const pp=path.join('recovered-app','src/lib/prisma.ts');
          const prismaSrc=fs.readFileSync(pp,'utf8');
          const prismaBefore='const pool = globalForPrisma.pgPool ?? new Pool({ connectionString: process.env.DATABASE_URL });';
          const prismaAfter='const databaseUrl = process.env.RECOVERY_DATABASE_URL?.trim() || process.env.DATABASE_URL;\nif (!databaseUrl) throw new Error("Database connection is not configured.");\nconst pool = globalForPrisma.pgPool ?? new Pool({ connectionString: databaseUrl });';
          if(!prismaSrc.includes(prismaBefore)) throw new Error('Prisma connection line not found');
          fs.writeFileSync(pp,prismaSrc.replace(prismaBefore,prismaAfter));

          const bp=path.join('recovered-app','src/lib/secondaryBackup.ts');
          const backupSrc=fs.readFileSync(bp,'utf8');
          const backupBefore='const url = process.env.BACKUP_DATABASE_URL?.trim();';
          const backupAfter='const url = process.env.RECOVERY_BACKUP_DATABASE_URL?.trim() || process.env.BACKUP_DATABASE_URL?.trim();';
          if(!backupSrc.includes(backupBefore)) throw new Error('Backup connection line not found');
          fs.writeFileSync(bp,backupSrc.replace(backupBefore,backupAfter));

          console.log(`reconstructed ${Object.keys(base).length} + ${Object.keys(overlay).length}; applied compiler-only guard and recovery-specific DB routing`);
          NODE
      - name: Install, typecheck, and build
        working-directory: recovered-app
        run: |
          npm install --ignore-scripts
          npx prisma generate
          npx tsc --noEmit
          npm run build
        env:
          DATABASE_URL: postgresql://old:blocked@localhost:5432/postgres
          RECOVERY_DATABASE_URL: postgresql://recovery:good@localhost:5432/postgres
          RECOVERY_BACKUP_DATABASE_URL: postgresql://backup:good@localhost:5432/postgres
          STATSGUY_REFRESH_ENABLED: "false"

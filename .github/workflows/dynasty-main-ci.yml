name: dynasty-main-ci
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/postgres
        run: npx prisma generate
      - name: Typecheck root production app
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/postgres
          BACKUP_DATABASE_URL: postgresql://user:pass@localhost:5432/postgres
          TRADYR_REFRESH_ENABLED: "true"
        run: npx tsc --noEmit
      - name: Capture root production build
        id: build
        continue-on-error: true
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/postgres
          BACKUP_DATABASE_URL: postgresql://user:pass@localhost:5432/postgres
          TRADYR_REFRESH_ENABLED: "true"
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee root-build.log
      - name: Upload root build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: root-build-log
          path: root-build.log
          if-no-files-found: error
      - name: Fail if root build failed
        if: steps.build.outcome != 'success'
        run: exit 1
